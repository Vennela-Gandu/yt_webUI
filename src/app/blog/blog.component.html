<h1 class="page-title blog-heading">YT Creator Blog</h1>
<div class="search-box">
  <input type="text"
         [(ngModel)]="searchQuery"
         placeholder="Search blog..."
         (keyup.enter)="onSearch()" />
  <button (click)="onSearch()">Search</button>
  <button (click)="clear()">Clear</button>
</div>
<div class="blog-layout">

  
  <!-- LEFT: BLOG POSTS -->
  <div class="blog-posts">

    <div *ngFor="let post of posts" class="post-card" (click)="openPost(post.slug)">

      <!-- A real link, so the post is reachable by keyboard and by a crawler;
           the whole card stays clickable for pointer users. -->
      <h2 class="post-title">
        <a [routerLink]="['/blog', post.slug, post.postID]"
           (click)="$event.stopPropagation()">
          <span [innerHTML]="post.title"></span>
        </a>
      </h2>

      <!-- Byline: date, author, and an "Updated" stamp once edited -->
      <div class="post-meta" (click)="$event.stopPropagation()">
        <span class="published">
          {{ post.publishedDate | date:'dd MMM yyyy, hh:mm a':'+0530' }} IST
        </span>

        <a class="author"
           *ngIf="post.authorName"
           [routerLink]="['/author', authorSlug(post.authorName)]">
          {{ post.authorName }}
        </a>

        <span class="updated" *ngIf="post.wasUpdated">
          Updated {{ post.updatedDate | date:'dd MMM yyyy, hh:mm a':'+0530' }} IST
        </span>
      </div>

      <p class="post-desc">
        <span [innerHTML]="post.shortDescription"></span>
      </p>

      <div class="post-footer">
        <span class="category" *ngFor="let c of post.categoryNames">
          {{ c.name }}
        </span>

        <!-- ADMIN EDIT BUTTON -->
        <button *ngIf="isAdmin"
                class="edit-btn"
                (click)="editPost(post.postID)">
          ✏ Edit
        </button>
      </div>

    </div>

    <p *ngIf="posts.length === 0" class="empty">
      No posts found for this category
    </p>

  </div>
  

  <!-- RIGHT: CATEGORIES -->
  <aside class="blog-sidebar">
  

    <h2>Categories</h2>

    <ul>
      <li *ngFor="let c of categories"
          [class.active]="c.categoryID === selectedCategoryId"
          (click)="onCategoryClick(c.slug)">
        {{ c.name }}
      </li>
    </ul>

  </aside>

</div>
<div class="pagination" *ngIf="totalPages > 1">

  <button (click)="goToPage(currentPage - 1)"
          [disabled]="currentPage === 1">
    Prev
  </button>

  <button *ngFor="let p of [].constructor(totalPages); let i = index"
          (click)="goToPage(i + 1)"
          [class.active]="currentPage === i + 1">
    {{ i + 1 }}
  </button>

  <button (click)="goToPage(currentPage + 1)"
          [disabled]="currentPage === totalPages">
    Next
  </button>
</div>

<!-- Where to go next. The link to this page is dropped automatically. -->
<app-explore-links></app-explore-links>
