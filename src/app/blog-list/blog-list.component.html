<h2>Blog List</h2>

<!-- FILTER BAR -->
<div class="filter-bar">

  <input type="text"
         placeholder="Search by Title"
         [(ngModel)]="searchTitle"
         (input)="applyFilters()" />

  <select [(ngModel)]="selectedCategory" (change)="applyFilters()">
    <option value="">All Categories</option>
    <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
  </select>

  <select [(ngModel)]="selectedStatus" (change)="applyFilters()">
    <option value="">All Status</option>
    <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
  </select>

  <input type="date"
         [(ngModel)]="selectedDate"
         (change)="applyFilters()" />

</div>

<!-- TABLE -->
<table class="table table-bordered">
  <thead>
    <tr>
      <th>Title</th>
      <th>Category</th>
      <th>Published Date</th>
      <th>Status</th>
      <th width="120">Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let blog of paginatedBlogs">
      <td data-label="Title">{{ blog.title }}</td>
      <td data-label="Category">{{ blog.category }}</td>
      <td data-label="Date">{{ blog.publishedDate | date:'dd MMM yyyy' }}</td>
      <td data-label="Status">
        <span [ngClass]="{
            'status-published': blog.status === 'Published',
            'status-draft': blog.status === 'Draft'
          }">
          {{ blog.status }}
        </span>
      </td>
      <td data-label="Actions">
        <a [routerLink]="['/admin/blog-edit', blog.id]"
           class="btn btn-primary btn-sm">
          Edit
        </a>
        <button class="btn btn-danger btn-sm"
                (click)="deleteBlog(blog.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- PAGINATION -->
<div class="pagination">
  <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
    Prev
  </button>

  <span>Page {{ currentPage }} of {{ totalPages }}</span>

  <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">
    Next
  </button>
</div>
