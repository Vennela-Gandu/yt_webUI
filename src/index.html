<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YT Creator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/Yt Creator Icon.png">
  <link rel="apple-touch-icon" href="assets/Yt Creator Icon.png">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Google Tag Manager -->
  <!-- Google Tag Manager (moved to AppComponent to avoid SSR execution) -->
  <!-- GTM script will be injected in the browser only -->
  <!-- End GTM -->
  <!-- SEO Schema -->
  <!-- <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YT Creator",
      "url": "https://ytcreator.in"

</head>
<body>
  <!-- GTM (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TBHBSX7F"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <!-- Google Analytics -->
  <!-- Google Analytics (moved to AppComponent to avoid SSR execution) -->
  <!-- GA script will be injected in the browser only -->
  <style>
    .coming-soon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 2rem;
    }

    .coming-soon-text {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .coming-soon-text {
        font-size: 2rem;
      }
    }
  </style>
  <app-root></app-root>
</body>
</html>
