  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-left">
      <i class="fa fa-envelope" aria-hidden="true"></i>
      <a href="mailto:support@ytcreator.in">support&#64;ytcreator.in</a>
    </div>
    <div class="top-right">
      <!-- Icon-only links carry their name as real text (visually hidden) so
           crawlers and screen readers get anchor text, not an empty link. -->
      <a *ngFor="let social of socialLinks"
         [href]="social.url"
         [attr.aria-label]="social.label"
         [title]="social.name"
         target="_blank"
         rel="me noopener">
        <i [class]="social.icon" aria-hidden="true"></i>
        <span class="sr-only">{{ social.label }}</span>
      </a>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <div class="site-header header-inner">
    <!-- LOGO -->
    <div class="logo" routerLink="/">
      <img src="assets/Yt Creator Icon.webp" alt="YT Creator">
      <span>YT Creator</span>
    </div>

    <!-- HAMBURGER -->
    <button class="hamburger"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen"
            aria-controls="site-nav"
            aria-label="Menu">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <!-- NAVIGATION -->
    <!-- onNavClick closes the mobile panel the moment a link is tapped. -->
    <nav class="nav"
         id="site-nav"
         [class.open]="menuOpen"
         (click)="onNavClick($event)">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/aboutus" routerLinkActive="active">About Us</a>
      <a routerLink="/youtubeseo" routerLinkActive="active">YouTube SEO</a>
