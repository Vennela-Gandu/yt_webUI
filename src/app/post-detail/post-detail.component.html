
<div class="blog-layout">
  <div class="blog-detail-wrapper" *ngIf="post">

    <!-- TITLE -->
    <h1 class="blog-title">
      {{ post.title }}
    </h1>

    <!-- Byline: publish date, author link, and "Updated" once revised -->
    <div class="post-meta">
      <span class="published">
        {{ post.publishedDate | date:'dd MMM yyyy, hh:mm a':'+0530' }} IST
      </span>

      <a class="author"
         *ngIf="post.authorName"
         [routerLink]="['/author', authorSlug(post.authorName)]">
        {{ post.authorName }}
      </a>

      <span class="updated" *ngIf="post.wasUpdated">
        Updated {{ post.updatedDate | date:'dd MMM yyyy, hh:mm a':'+0530' }} IST
      </span>
    </div>
    <!-- KEYWORDS -->
    <!--<div class="keywords" *ngIf="post.keywords">
    <span class="keyword"
          *ngFor="let key of post.keywords.split(',')">
      #{{ key.trim() }}
    </span>
  </div>-->
    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- CONTENT -->
    <div class="blog-content"
         [innerHTML]="content">
    </div>

    <!-- Social Share -->
    <div class="social-share">
      <span>Share:</span>

      <!-- Icon-only controls carry their action as real text (visually hidden)
           so screen readers announce them; the icon itself is decorative. -->
      <button type="button" (click)="share('facebook')" title="Share on Facebook"
              aria-label="Share this post on Facebook">
        <i class="fab fa-facebook-f" aria-hidden="true"></i>
        <span class="sr-only">Share this post on Facebook</span>
      </button>

      <button type="button" (click)="share('twitter')" title="Share on X"
              aria-label="Share this post on X (Twitter)">
        <i class="fab fa-x-twitter" aria-hidden="true"></i>
        <span class="sr-only">Share this post on X (Twitter)</span>
      </button>

      <button type="button" (click)="share('linkedin')" title="Share on LinkedIn"
              aria-label="Share this post on LinkedIn">
        <i class="fab fa-linkedin-in" aria-hidden="true"></i>
        <span class="sr-only">Share this post on LinkedIn</span>
      </button>

      <button type="button" (click)="share('whatsapp')" title="Share on WhatsApp"
              aria-label="Share this post on WhatsApp">
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
        <span class="sr-only">Share this post on WhatsApp</span>
      </button>

      <button type="button" class="copy-link" (click)="copyLink()" title="Copy Link"
              aria-label="Copy a link to this post">
        <i class="fas fa-link" aria-hidden="true"></i>
        <span class="sr-only">Copy a link to this post</span>
        <span class="copy-status" *ngIf="copied">Copied!</span>
      </button>
    </div>

    <div class="related-posts" *ngIf="relatedPosts.length">
      <h3>Related Posts</h3>

      <ul>
        <li *ngFor="let p of relatedPosts">
          <a (click)="openRelatedPost(p.slug)">
            {{ p.title }}
          </a>
        </li>
      </ul>
    </div>

    <!-- Post Navigation -->
    <!--<div class="post-navigation">
    <a *ngIf="prevPost" [routerLink]="['/post', prevPost.slug]">
      ← {{ prevPost.title }}
    </a>
  <a *ngIf="nextPost" [routerLink]="['/post', nextPost.slug]">
    {{ nextPost.title }} →
  </a>
  </div>-->
    <!-- Latest Posts -->
    <!--<div class="Latest-posts">
    <h3>Latest Posts</h3>

    <div class="Latest-item" *ngFor="let post of latestPosts">
      <a [routerLink]="['/post', post.slug]">
        {{ post.title }}
      </a>
    </div>
  </div>-->

  </div>
  <!-- RIGHT: CATEGORIES -->
  <aside class="blog-sidebar">

    <h3>Categories</h3>

    <ul>
      <li *ngFor="let c of categories"
          [class.active]="c.categoryID === selectedCategoryId"
          (click)="loadPosts(c.slug)">
        {{ c.name }}
      </li>
    </ul>

  </aside>
</div>
