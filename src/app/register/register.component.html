<h1 class="page-title">Create Your Account</h1>
<form (ngSubmit)="register()">
  <input type="email"
         [(ngModel)]="email"
         name="email"
         required
         placeholder="Email" />

  <input type="password"
         [(ngModel)]="password"
         name="password"
         required
         placeholder="Password" />

  <button type="submit">Register</button>
</form>
