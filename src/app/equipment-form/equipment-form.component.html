<div class="admin-wrapper">

  <h1 class="page-title">
    {{ equipment.equipmentID ? 'Edit Equipment' : 'Add New Equipment' }}
  </h1>

  <div class="card">

    <!-- TITLE -->
    <div class="form-group">
      <label>Equipment Title <span class="required">*</span></label>
      <input type="text"
             [(ngModel)]="equipment.title"
             class="form-control"
             placeholder="Enter equipment title" />
    </div>

    <!-- CATEGORIES -->
    <div class="form-group">
      <label>Main Categories & Sub Categories <span class="required">*</span></label>

      <div *ngFor="let cat of categories" style="margin-bottom: 12px;">

        <!-- MAIN CATEGORY -->
        <label class="main-category-label">
          <input type="checkbox"
                 [checked]="equipment.mainCategoryIDs.includes(cat.id)"
                 (change)="toggleMainCategory(cat.id, $event)" />
          <span class="category-title">{{ cat.name }}</span>
        </label>

        <!-- SUB CATEGORIES -->
        <div class="checkbox-group" style="margin-left:20px; margin-top:6px;">
          <label *ngFor="let sub of cat.subs">
            <input type="checkbox"
                   [checked]="equipment.subCategoryIDs.includes(sub.id)"
                   (change)="toggleSubCategory(cat.id, sub.id, $event)" />
            {{ sub.name }}
          </label>
        </div>

      </div>

      <small class="hint">
        At least one sub category must be selected
      </small>
    </div>


    <!--SCHEDULE-->
    <div class="form-group">
      <label>Publish Date</label>
      <input type="datetime-local"
             [(ngModel)]="equipment.publishedDate" />
      <small class="hint">
        Leave empty to publish immediately (IST)
      </small>
    </div>

    <!-- SEO KEYWORDS (NEW) -->
    <div class="form-group">
      <label>SEO Keywords (optional)</label>
      <input type="text"
             [(ngModel)]="equipment.keywords"
             class="form-control"
             placeholder="keyword1, keyword2" />
      <small class="hint">
        Comma-separated keywords for SEO (optional)
      </small>
    </div>

    <!--SHORT DESCRIPTION-->
    <div class="form-group">
      <label>Short Description <span class="required">*</span></label>
      <textarea rows="3"
                maxlength="500"
                [(ngModel)]="equipment.shortDescription"
                placeholder="Brief summary shown in equipment listing">
      </textarea>
      <small class="hint">
        {{ equipment.shortDescription?.length || 0 }}/500 characters
      </small>
    </div>

    <!--CONTENT (PLAIN TEXTAREA – NO CKEDITOR)-->
    <div class="form-group">
      <label>Equipment Content <span class="required">*</span></label>
      <ckeditor [editor]="Editor"
                [(ngModel)]="equipment.description"
                [config]="editorConfig">
      </ckeditor>
      <!--<textarea rows="12"
              [(ngModel)]="equipment.description"
              placeholder="Write full equipment review / article here">
    </textarea>-->
    </div>


    <div class="actions">

      <button class="btn secondary"
              type="button"
              (click)="resetForm()">
        Reset
      </button>

      <button class="btn btn-primary"
              [disabled]="!isFormValid() || isSubmitting"
              (click)="save()">

        <span *ngIf="!isSubmitting">
          {{
            equipment.publishedDate
              ? 'Schedule Equipment'
              : equipment.equipmentID
                ? 'Update Equipment'
                : 'Publish Now'
          }}
        </span>

        <span *ngIf="isSubmitting">
          Saving...
        </span>

      </button>

    </div>

  </div>
</div>
