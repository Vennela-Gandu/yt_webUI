<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YT Creator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/webp" href="assets/Yt Creator Icon.webp">
  <link rel="apple-touch-icon" href="assets/Yt Creator Icon.webp">

  <!-- Third-party origins used on every page. Connecting early removes the
       DNS + TLS wait from the critical path; the audit reported none of these
       were preconnected. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Icon fonts, referenced by the Font Awesome subset in styles.css.
       Preloaded so they start downloading from the document itself rather
       than after the stylesheet is parsed. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/webfonts/fa-brands-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/webfonts/fa-solid-900.woff2">

  <!-- Font Awesome's stylesheet is NOT loaded: 18.1 of its 18.3 KiB went
       unused. The 39 icons this site uses are inlined in the site stylesheet
       (see the subset at the end of styles.css). Only the font files below
       are still fetched from the CDN. -->

  <!-- Inter, the site's only typeface. Linked here rather than @import-ed from
       styles.css: an @import is only discovered after that stylesheet is
       fetched and parsed, which added a whole extra step to the chain. -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <!-- Google Tag Manager -->
  <!-- Google Tag Manager (moved to AppComponent to avoid SSR execution) -->
  <!-- GTM script will be injected in the browser only -->
  <!-- End GTM -->
  <!-- SEO Schema -->
  <!-- <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "YT Creator",
      "url": "https://ytcreator.in"
    }
  </script> -->
</head>
<body>
  <!-- GTM (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TBHBSX7F"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <!-- Google Analytics -->
  <!-- Google Analytics (moved to AppComponent to avoid SSR execution) -->
  <!-- GA script will be injected in the browser only -->
  <style>
    .coming-soon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      padding: 2rem;
    }

    .coming-soon-text {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .coming-soon-text {
        font-size: 2rem;
      }
    }
  </style>
  <app-root></app-root>
</body>
</html>
